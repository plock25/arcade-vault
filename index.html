<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Vault</title>
  <style>
    body { background-color: #1a1a1a; color: #fff; font-family: monospace; text-align: center; padding-top: 50px; }
    #vault-content { display: none; margin-top: 20px; }
    input { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #444; }
    button { padding: 10px 15px; font-size: 16px; cursor: pointer; background-color: #00ffcc; border: none; border-radius: 5px; color: #000; font-weight: bold; }
    .game-btn { display: block; width: 250px; margin: 10px auto; padding: 15px; background: #333; color: white; text-decoration: none; border-radius: 8px; border: 1px solid #555; }
    .game-btn:hover { background: #444; }
  </style>
</head>
<body>
  <h1>Math Notes</h1>
  
  <div id="login-section">
    <input type="password" id="passcode" placeholder="Enter PIN">
    <button onclick="checkPin()">Unlock</button>
  </div>

  <div id="vault-content">
    <h2>Select a File</h2>
    <a href="play.html?game=mario" class="game-btn">Super Mario Bros.</a>
    <a href="play.html?game=punchout" class="game-btn">Mike Tyson's Punch-Out!!</a>
    <a href="play.html?game=tetris" class="game-btn">Tetris</a>
  </div>

  <script>
    function checkPin() {
      if (document.getElementById('passcode').value === '0525') {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('vault-content').style.display = 'block';
      } else {
        alert('Incorrect PIN');
      }
    }
  </script>
</body>
</html>
