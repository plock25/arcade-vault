<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patrick's Vault</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0e15">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Patrick's Vault">
  
  <style>
    :root {
      --bg-color: #0d0e15;
      --card-bg: #161824;
      --accent-color: #3a86ff;
      --accent-hover: #0066ff;
      --text-color: #ffffff;
      --text-muted: #a0a5c0;
      --danger-color: #ff0055;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Lock Screen Overlay */
    #lock-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(13, 14, 21, 0.98);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    #lock-screen.hidden {
      display: none;
    }

    .passcode-box {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      width: 300px;
    }

    .passcode-input {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--accent-color);
      border-radius: 6px;
      color: #fff;
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: 4px;
      outline: none;
    }

    .btn {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
      width: 100%;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    /* Header & Navbar */
    header {
      background: var(--card-bg);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-color);
      letter-spacing: 1px;
    }

    .controls {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .search-bar {
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 15px;
      border-radius: 20px;
      color: #fff;
      outline: none;
      width: 200px;
      transition: width 0.3s;
    }

    .search-bar:focus {
      width: 280px;
      border-color: var(--accent-color);
    }

    /* Main Grid */
    main {
      padding: 30px;
      flex: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid rgba(255,255,255,0.05);
      position: relative;
    }

    .game-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(58, 134, 255, 0.2);
    }

    .card-thumb {
      width: 100%;
      height: 140px;
      background: #252836;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    .card-title {
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      color: var(--text-color);
    }

    /* DVD Screensaver Overlay */
    #dvd-screensaver {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 2000;
      display: none;
    }

    #dvd-logo {
      position: absolute;
      width: 120px;
      height: 60px;
      background: var(--accent-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border-radius: 8px;
    }

    /* High Scores Modal */
    #highscores-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1500;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .close-modal {
      cursor: pointer;
      font-size: 1.5rem;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    /* Trap Button */
    .trap-btn {
      background: var(--danger-color);
      margin-top: 10px;
    }

    /* CRT Scanline Recovery Animation for Cards */
    @keyframes crtScan {
      0% { opacity: 0; filter: brightness(2) contrast(2); }
      50% { opacity: 0.8; filter: brightness(1.5); }
      100% { opacity: 1; filter: brightness(1); }
    }
  </style>
</head>
<body>

  <!-- Passcode Lock Screen -->
  <div id="lock-screen">
    <div class="passcode-box">
      <h2>Vault Access</h2>
      <input type="password" id="passcode-input" class="passcode-input" maxlength="4" placeholder="••••" pattern="[0-9]*" inputmode="numeric">
      <button class="btn" onclick="checkPasscode()">Unlock</button>
      <button class="btn trap-btn" onclick="triggerTrap()">System Diagnostics</button>
    </div>
  </div>

  <!-- Header Controls -->
  <header>
    <div class="logo">PATRICK'S VAULT</div>
    <div class="controls">
      <input type="text" id="search-input" class="search-bar" placeholder="Search games..." onkeyup="filterGames()">
      <button class="btn" style="width: auto;" onclick="launchRandomGame()">Random</button>
      <button class="btn" style="width: auto; background: #252836;" onclick="toggleHighScores()">High Scores</button>
    </div>
  </header>

  <!-- Main Game Launcher Grid -->
  <main>
    <div class="grid" id="game-grid">
      <!-- Game Cards Render Dynamic Grid -->
    </div>
  </main>

  <!-- DVD Bouncing Screensaver -->
  <div id="dvd-screensaver">
    <div id="dvd-logo">VAULT</div>
  </div>

  <!-- High Scores Modal -->
  <div id="highscores-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Leaderboards</h3>
        <span class="close-modal" onclick="toggleHighScores()">&times;</span>
      </div>
      <div id="highscores-list">
        <!-- Dynamic Scores -->
      </div>
      <a href="https://forms.google.com" target="_blank" class="btn" style="display: inline-block; text-align: center; margin-top: 15px; text-decoration: none;">Submit Score</a>
    </div>
  </div>

  <script>
    // System & Launcher State
    const GAMES_DATA = [
      { id: '1', title: 'Super Mario Bros', icon: '🍄', url: 'https://emulatorjs.org' },
      { id: '2', title: 'Tetris', icon: '🧱', url: 'https://emulatorjs.org' },
      { id: '3', title: 'Pac-Man', icon: '🟡', url: 'https://emulatorjs.org' },
      { id: '4', title: 'Sonic the Hedgehog', icon: '🦔', url: 'https://emulatorjs.org' },
      { id: '5', title: 'Street Fighter II', icon: '🥊', url: 'https://emulatorjs.org' },
      { id: '6', title: 'Legend of Zelda', icon: '🗡️', url: 'https://emulatorjs.org' },
      { id: '7', title: 'Doom', icon: '💀', url: 'https://emulatorjs.org' },
      { id: '8', title: 'Galaga', icon: '🚀', url: 'https://emulatorjs.org' },
      { id: '9', title: 'Donkey Kong', icon: '🦍', url: 'https://emulatorjs.org' },
      { id: '10', title: 'Mega Man', icon: '🤖', url: 'https://emulatorjs.org' },
      { id: '11', title: 'Castlevania', icon: '🦇', url: 'https://emulatorjs.org' },
      { id: '12', title: 'Metroid', icon: '👽', url: 'https://emulatorjs.org' },
      { id: '13', title: 'Contra', icon: '💥', url: 'https://emulatorjs.org' },
      { id: '14', title: 'Space Invaders', icon: '👾', url: 'https://emulatorjs.org' },
      { id: '15', title: 'Punch-Out!!', icon: '🥊', url: 'https://emulatorjs.org' },
      { id: '16', title: 'Pokemon Red', icon: '🔴', url: 'https://emulatorjs.org' },
      { id: '17', title: 'Excitebike', icon: '🏍️', url: 'https://emulatorjs.org' },
      { id: '18', title: 'Double Dragon', icon: '🐉', url: 'https://emulatorjs.org' },
      { id: '19', title: 'Mortal Kombat', icon: '⚡', url: 'https://emulatorjs.org' }
    ];

    const highScores = [
      { name: 'Tetris', initials: 'PAT', score: '999900' },
      { name: 'Pac-Man', initials: 'ACE', score: '450200' },
      { name: 'Galaga', initials: 'FOX', score: '320110' },
      { name: 'Super Mario', initials: 'MAR', score: '280000' }
    ];

    // Render Grid
    function initGrid() {
      const grid = document.getElementById('game-grid');
      grid.innerHTML = GAMES_DATA.map(game => `
        <div class="game-card" onclick="launchGameApp('${game.url}')">
          <div class="card-thumb">${game.icon}</div>
          <div class="card-title">${game.title}</div>
        </div>
      `).join('');
    }
    initGrid();

    // Passcode Security (Default: 0525)
    function checkPasscode() {
      const val = document.getElementById('passcode-input').value;
      if (val === '0525') {
        document.getElementById('lock-screen').classList.add('hidden');
      } else {
        alert('Access Denied');
        document.getElementById('passcode-input').value = '';
      }
    }

    // Trap / Decoy Button
    function triggerTrap() {
      window.location.href = "https://www.google.com";
    }

    // Launch App Window
    function launchGameApp(url) {
      const win = window.open('about:blank', '_blank');
      if (win) {
        win.document.body.style.margin = '0';
        win.document.body.style.height = '100vh';
        const iframe = win.document.createElement('iframe');
        iframe.style.border = 'none';
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.src = url;
        win.document.body.appendChild(iframe);
      } else {
        window.location.href = url;
      }
    }

    // Random Game
    function launchRandomGame() {
      const randomIndex = Math.floor(Math.random() * GAMES_DATA.length);
      launchGameApp(GAMES_DATA[randomIndex].url);
    }

    // Search Filter
    function filterGames() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const cards = document.querySelectorAll('.game-card');
      cards.forEach((card, index) => {
        const title = GAMES_DATA[index].title.toLowerCase();
        if (title.includes(query)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }

    // High Scores Modal Toggle
    function toggleHighScores() {
      const modal = document.getElementById('highscores-modal');
      if (modal.style.display === 'flex') {
        modal.style.display = 'none';
      } else {
        modal.style.display = 'flex';
        renderHighScores();
      }
    }

    function renderHighScores() {
      const container = document.getElementById('highscores-list');
      const sorted = [...highScores].sort((a, b) => parseInt(b.score) - parseInt(a.score));
      container.innerHTML = sorted.map(game => `
        <div class="score-item">
          <span class="score-item-title">${game.name}</span>
          <span class="score-item-val">${game.initials} -${game.score}</span>
        </div>
      `).join('');
    }

    // Panic Keybind (Redirects instantly to Google Classroom)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === '`') {
        window.location.href = 'https://classroom.google.com';
      }
    });

    // Konami Code Bypass Setup
    const konamiSequence = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
    let konamiIndex = 0;
    document.addEventListener('keydown', (e) => {
      if (e.key === konamiSequence[konamiIndex]) {
        konamiIndex++;
        if (konamiIndex === konamiSequence.length) {
          document.getElementById('lock-screen').classList.add('hidden');
          konamiIndex = 0;
        }
      } else {
        konamiIndex = 0;
      }
    });

    // DVD Screensaver Logic
    let idleTime = 0;
    const screensaver = document.getElementById('dvd-screensaver');
    const dvdLogo = document.getElementById('dvd-logo');
    let posX = 100, posY = 100;
    let speedX = 2, speedY = 2;
    let dvdInterval;

    function resetIdleTimer() {
      idleTime = 0;
      if (screensaver.style.display === 'block') {
        screensaver.style.display = 'none';
        clearInterval(dvdInterval);
      }
    }
    window.onload = resetIdleTimer;
    document.onmousemove = resetIdleTimer;
    document.onkeypress = resetIdleTimer;

    setInterval(() => {
      idleTime++;
      if (idleTime >= 60 && screensaver.style.display !== 'block') { // 60 seconds idle
        screensaver.style.display = 'block';
        dvdInterval = setInterval(moveDVD, 20);
      }
    }, 1000);

    function moveDVD() {
      const winW = window.innerWidth;
      const winH = window.innerHeight;
      
      posX += speedX;
      posY += speedY;

      if (posX + 120 >= winW || posX <= 0) {
        speedX = -speedX;
        dvdLogo.style.background = '#' + Math.floor(Math.random()*16777215).toString(16);
      }
      if (posY + 60 >= winH || posY <= 0) {
        speedY = -speedY;
        dvdLogo.style.background = '#' + Math.floor(Math.random()*16777215).toString(16);
      }

      dvdLogo.style.left = posX + 'px';
      dvdLogo.style.top = posY + 'px';
    }

    // ==========================================
    // Gun Shoot & Pixel Particle Shatter Feature
    // ==========================================
    (function() {
      document.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'p') {
          const cards = document.querySelectorAll('.game-card');
          const visibleCards = Array.from(cards).filter(c => c.style.display !== 'none' && !c.dataset.shattered);

          if (visibleCards.length > 0) {
            // Target a random visible game card
            const targetCard = visibleCards[Math.floor(Math.random() * visibleCards.length)];
            fireGunAt(targetCard);
          } else {
            // If all cards are shattered, regenerate them with CRT scanline effect
            regenerateCards(cards);
          }
        }
      });

      function fireGunAt(target) {
        const rect = target.getBoundingClientRect();
        const startX = window.innerWidth / 2;
        const startY = window.innerHeight;
        const endX = rect.left + rect.width / 2;
        const endY = rect.top + rect.height / 2;

        // 1. Muzzle Flash
        createMuzzleFlash(startX, startY);

        // 2. Animated Bullet Trajectory
        const bullet = document.createElement('div');
        bullet.style.cssText = `
          position: fixed;
          width: 8px;
          height: 8px;
          background: #fff700;
          box-shadow: 0 0 10px #ff5500, 0 0 20px #ff5500;
          border-radius: 50%;
          pointer-events: none;
          z-index: 9999;
          transform: translate(${startX}px, ${startY}px);
          transition: transform 0.15s linear;
        `;
        document.body.appendChild(bullet);

        requestAnimationFrame(() => {
          bullet.style.transform = `translate(${endX}px, ${endY}px)`;
        });

        // 3. Impact & Pixel Shatter Effect
        setTimeout(() => {
          bullet.remove();
          shatterCardIntoPixels(target, endX, endY);
        }, 150);
      }

      function createMuzzleFlash(x, y) {
        const flash = document.createElement('div');
        flash.style.cssText = `
          position: fixed;
          left: ${x - 25}px;
          top: ${y - 50}px;
          width: 50px;
          height: 50px;
          background: radial-gradient(circle, #ffffff 0%, #ffbb00 50%, transparent 80%);
          border-radius: 50%;
          pointer-events: none;
          z-index: 10000;
          opacity: 1;
          transition: opacity 0.1s ease-out;
        `;
        document.body.appendChild(flash);
        setTimeout(() => {
          flash.style.opacity = '0';
          setTimeout(() => flash.remove(), 100);
        }, 50);
      }

      function shatterCardIntoPixels(card, impactX, impactY) {
        card.dataset.shattered = 'true';
        const rect = card.getBoundingClientRect();
        const pixelSize = 8; // Size of exploding pixel debris

        card.style.opacity = '0';
        card.style.pointerEvents = 'none';

        for (let x = rect.left; x < rect.right; x += pixelSize) {
          for (let y = rect.top; y < rect.bottom; y += pixelSize) {
            const pixel = document.createElement('div');
            const color = '#3a86ff'; // Accent pixel color
            
            pixel.style.cssText = `
              position: fixed;
              left: ${x}px;
              top: ${y}px;
              width: ${pixelSize}px;
              height: ${pixelSize}px;
              background: ${color};
              box-shadow: 0 0 4px ${color};
              pointer-events: none;
              z-index: 9998;
            `;

            document.body.appendChild(pixel);

            const angle = Math.atan2(y - impactY, x - impactX);
            const force = Math.random() * 12 + 4;
            let vx = Math.cos(angle) * force + (Math.random() - 0.5) * 4;
            let vy = Math.sin(angle) * force - Math.random() * 6;
            let posX = x;
            let posY = y;
            let opacity = 1;

            function animate() {
              if (opacity <= 0) {
                pixel.remove();
                return;
              }
              vy += 0.4; // Gravity effect
              posX += vx;
              posY += vy;
              opacity -= 0.02;

              pixel.style.transform = `translate(${posX - x}px, ${posY - y}px)`;
              pixel.style.opacity = opacity;

              requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);
          }
        }
      }

      function regenerateCards(cards) {
        cards.forEach((card, index) => {
          setTimeout(() => {
            delete card.dataset.shattered;
            card.style.pointerEvents = 'auto';
            card.style.animation = 'crtScan 0.4s ease-in-out forwards';
            card.style.opacity = '1';
          }, index * 80);
        });
      }
    })();
  </script>
</body>
</html>
