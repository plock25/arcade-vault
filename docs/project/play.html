<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Viewer</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const gameChoice = params.get('game');

    let romPath = '';
    if (gameChoice === 'mario') {
      romPath = 'mario.nes';
    } else if (gameChoice === 'punchout') {
      romPath = 'punchout.nes';
    } else if (gameChoice === 'tetris') {
      romPath = 'tetris.nes';
    } else if (gameChoice === 'zelda') {
      romPath = 'zelda.nes';
    } else if (gameChoice === 'contra') {
      romPath = 'contra.nes';
    } else if (gameChoice === 'donkeykong') {
      romPath = 'donkeykong.nes';
    } else if (gameChoice === 'megaman') {
      romPath = 'megaman.nes';
    } else if (gameChoice === 'metroid') {
      romPath = 'metroid.nes';
    } else if (gameChoice === 'kirby') {
      romPath = 'kirby.nes';
    } else if (gameChoice === 'excitebike') {
      romPath = 'excitebike.nes';
    } else if (gameChoice === 'paperboy') {
      romPath = 'paperboy.nes';
    }

    if (romPath) {
      window.EJS_player = '#game';
      window.EJS_core = 'nes';
      window.EJS_gameUrl = romPath;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    }
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
