<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player</title>
  <style>
    body { margin: 0; background-color: #000; height: 100vh; display: flex; justify-content: center; align-items: center; }
    #game-container { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const game = urlParams.get('game');

    const romMap = {
      'mario': 'mario.nes',
      'punchout': 'punchout.nes',
      'tetris': 'tetris.nes'
    };

    const romFile = romMap[game];

    if (romFile) {
      window.EJS_player = '#game-container';
      window.EJS_core = 'nes';
      window.EJS_gameUrl = romFile; 
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

      const script = document.createElement('script');
      script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(script);
    } else {
      document.getElementById('game-container').innerHTML = '<h2 style="color:white;text-align:center;">Error: Game file missing!</h2>';
    }
  </script>
</body>
</html>
